
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Home Security</title>

    <link
        rel="stylesheet"
        href="/static/style.css"
    >
</head>

<body>

    <div class="container">

        <header class="header">

            <div>
                <h1>Home Security</h1>

                <p class="subtitle">
                    Face Recognition Monitoring
                </p>
            </div>

        </header>


        <section>

            <h2>Cameras</h2>

            <div class="camera-grid">

                {% for camera in cameras %}

                <a
                    href="/camera/{{ camera.camera_id }}"
                    class="camera-card"
                >

                    <div class="camera-icon">
                        📹
                    </div>

                    <div class="camera-info">

                        <h3>
                            {{ camera.name }}
                        </h3>

                        <p>
                            {{ camera.location }}
                        </p>

                    </div>

                    <div class="camera-arrow">
                        →
                    </div>

                </a>

                {% endfor %}

            </div>

        </section>

    </div>

</body>

</html>
